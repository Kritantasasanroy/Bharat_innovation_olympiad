name: Keep Render backend warm

on:
  schedule:
    # Every 10 minutes — comfortably under Render free tier's 15-min idle spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://olympiad-backend-wsvn.onrender.com/api/proctor/health
