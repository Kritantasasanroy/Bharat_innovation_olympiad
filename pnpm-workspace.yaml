packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  # `packages/frontend` is a stray, never-finished duplicate of the real
  # `frontend/` app at the repo root (same package name "olympiad-frontend",
  # same dependency set) — it carries a package.json, config files and a few
  # committed assets, but no committed `src/`, and was never wired up as a
  # real workspace member. Left in the `packages/*` glob, its now-stale
  # dependency list drifts out of sync with pnpm-lock.yaml every time the
  # real frontend/ is worked on, which breaks `pnpm install --frozen-lockfile`
  # for the *entire* workspace (ERR_PNPM_OUTDATED_LOCKFILE) — including
  # services that have nothing to do with the frontend, like admin-api.
  # Excluded here rather than deleted: nothing about its intent is certain
  # enough to remove committed files as a side effect of a Render deploy fix.
  - "!packages/frontend"

# Mirrors the bio-contracts pnpm catalog (TDD-001 §3): the shared contract
# packages reference `zod: catalog:` so the whole workspace pins one version.
catalog:
  zod: 4.4.3
# Consolidated BIO workspace.
# The five org repos (bio-contracts, bio-exam, bio-admin, bio-portal, bio-proctor)
# are flattened into one pnpm workspace here. Each org package keeps its distinct
# @bio/* name, so folder names carry the name minus the @bio/ prefix
# (e.g. @bio/exam-shared-types -> packages/exam-shared-types). This preserves the
# option to split any area back into its own repo later.
#
# NOT part of this workspace (kept on their existing npm toolchains until each
# service reaches parity and is retired): backend/ (NestJS), frontend/,
# admin-frontend/. Proctoring stays in the current client-side face-api.js
# implementation and is intentionally NOT recreated as the Python bio-proctor.
