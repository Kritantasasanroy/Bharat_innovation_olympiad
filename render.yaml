# Render Blueprint for the Bharat Innovation Olympiad backend services.
#
# This Blueprint deploys the legacy NestJS backend and the new pnpm/Bun/Elysia
# workspace services into the new Render account. It is intentionally
# conservative: it wires cross-service URLs and generates app-internal secrets,
# but it marks all third-party credentials and the database / Redis URLs as
# `sync: false`. On first deploy, Render will prompt you to fill those values
# in the dashboard before the services start.
#
# Web services use `plan: starter` so they stay awake and can talk to each other
# over Render's private network. You can downgrade individual services to `free`
# later from the dashboard; workers do not have a free tier.
#
# After the first deploy, run the Drizzle/Prisma migrations against the database
# you supply. The Blueprint does not run migrations automatically because the
# DATABASE_URL is external to Render.

services:
  # ── Legacy production backend (NestJS + Prisma) ──────────────────────────
  - type: web
    name: bio-legacy-backend
    runtime: node
    region: singapore
    plan: starter
    repo: https://github.com/Kritantasasanroy/Bharat_innovation_olympiad.git
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: PROCTOR_SERVICE_URL
        sync: false
      - key: PROCTOR_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: PARTNER_PORTAL_URL
        sync: false
      - key: SCHOOL_PORTAL_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: ADMIN_API_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOFACTOR_OTP_TEMPLATE
        value: AUTOGEN
      - key: TWOFACTOR_VERIFY_DELIVERY
        value: "true"
      - key: TWOFACTOR_SENDER_ID
        sync: false
      - key: TWOFACTOR_SMS_TEMPLATE
        sync: false
      - key: STORAGE_PROVIDER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_GALLERY_FOLDER_ID
        value: 17uieaNy6KULjNjJ-47AIcIrEn_QROR52
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        value: bio-olympiad-prod
      - key: WATI_API_ENDPOINT
        sync: false
      - key: WATI_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_REMINDERS_ENABLED
        value: "true"

  # ── New workspace services (Bun/Elysia) ──────────────────────────────────

  - type: web
    name: bio-exam-api
    runtime: node
    region: singapore
    plan: starter
    repo: https://github.com/Kritantasasanroy/Bharat_innovation_olympiad.git
    branch: main
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @bio/exam-api build
    startCommand: pnpm --filter @bio/exam-api exec bun run dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DEMO_EXAM_IDS
        sync: false

  - type: web
    name: bio-admin-api
    runtime: node
    region: singapore
    plan: starter
    repo: https://github.com/Kritantasasanroy/Bharat_innovation_olympiad.git
    branch: main
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @bio/admin-api build
    startCommand: pnpm --filter @bio/admin-api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BANK_DETAILS_ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: CONTRACT_VERSION
        value: "0.1.0"

  - type: web
    name: bio-portal-api
    runtime: node
    region: singapore
    plan: starter
    repo: https://github.com/Kritantasasanroy/Bharat_innovation_olympiad.git
    branch: main
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @bio/portal-api build
    startCommand: pnpm --filter @bio/portal-api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PARTNER_SUPPORT_EMAIL
        value: partners@bharatolympiad.in
      - key: STUDENT_APP_URL
        sync: false
      - key: SCHOOL_APP_URL
        sync: false
      - key: LOG_LEVEL
        value: info

