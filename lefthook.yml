pre-commit:
  parallel: true
  jobs:
    - name: biome-check
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx @biomejs/biome check --staged --no-errors-on-unmatched {staged_files}

    - name: lint-boundaries
      glob: "services/exam-api/src/core/**/*.ts"
      run: pnpm --filter @bio/exam-api lint:boundaries
